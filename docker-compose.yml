services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5433:5432"

  profile-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
    ports:
      - "5434:5432"

  account-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "5435:5432"

  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5436:5432"

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5437:5432"

  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    depends_on:
      - identity-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      DB_USERNAME: identity
      DB_PASSWORD: identity
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-banking-secret-change-me-at-least-32-bytes
      APP_ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8081:8081"

  profile-service:
    build:
      context: .
      args:
        MODULE: profile-service
    depends_on:
      - profile-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://profile-db:5432/profile_db
      DB_USERNAME: profile
      DB_PASSWORD: profile
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-banking-secret-change-me-at-least-32-bytes
      APP_ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8082:8082"

  account-service:
    build:
      context: .
      args:
        MODULE: account-service
    depends_on:
      - account-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://account-db:5432/account_db
      DB_USERNAME: account
      DB_PASSWORD: account
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-banking-secret-change-me-at-least-32-bytes
      APP_ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    depends_on:
      - payment-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: payment
      DB_PASSWORD: payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-banking-secret-change-me-at-least-32-bytes
      APP_ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    depends_on:
      - notification-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      DB_USERNAME: notification
      DB_PASSWORD: notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-banking-secret-change-me-at-least-32-bytes
      APP_ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    depends_on:
      - identity-service
      - profile-service
      - account-service
      - payment-service
      - notification-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      JWT_SECRET: local-banking-secret-change-me-at-least-32-bytes
      APP_ALLOWED_ORIGIN: http://localhost:8080
      IDENTITY_URL: http://identity-service:8081
      PROFILE_URL: http://profile-service:8082
      ACCOUNT_URL: http://account-service:8083
      PAYMENT_URL: http://payment-service:8084
      NOTIFICATION_URL: http://notification-service:8085
    ports:
      - "8080:8080"
