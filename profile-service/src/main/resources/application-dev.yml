spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/profile_db}
    username: ${DB_USERNAME:profile}
    password: ${DB_PASSWORD:profile}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
logging.level:
  root: INFO
  com.example.banking: DEBUG
profile.security:
  allowed-origins:
    - ${APP_ALLOWED_ORIGIN:http://localhost:8080}
  jwt:
    issuer: banking-identity-dev
    secret: ${JWT_SECRET:dev-banking-secret-change-me-at-least-32-bytes}
    ttl: PT2H
