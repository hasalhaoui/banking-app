spring:
#  jpa:
#    hibernate:
#      ddl-auto: validate
#    properties:
#      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/profile_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1999}
    hikari:
      initializationFailTimeout: 60000
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
profile.security:
  allowed-origins:
    - ${APP_ALLOWED_ORIGIN:http://localhost:8080}
  jwt:
    issuer: banking-identity-dev
    secret: ${JWT_SECRET:dev-banking-secret-change-me-at-least-32-bytes}
    ttl: PT2H
logging:
  level:
    org.flywaydb: TRACE
    root: INFO
    com.example.banking: DEBUG