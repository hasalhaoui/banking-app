apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: banking
spec:
  type: ClusterIP
  selector: { app: identity-service }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: banking
spec:
  type: ClusterIP
  selector: { app: profile-service }
  ports: [{ name: http, port: 8082, targetPort: 8082 }]
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: banking
spec:
  type: ClusterIP
  selector: { app: account-service }
  ports: [{ name: http, port: 8083, targetPort: 8083 }]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: banking
spec:
  type: ClusterIP
  selector: { app: payment-service }
  ports: [{ name: http, port: 8084, targetPort: 8084 }]
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: banking
spec:
  type: ClusterIP
  selector: { app: notification-service }
  ports: [{ name: http, port: 8085, targetPort: 8085 }]
