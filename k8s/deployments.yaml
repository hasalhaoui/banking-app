apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banking
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: app
          image: registry.example.com/banking/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secret }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 20 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: banking
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity-service }
  template:
    metadata:
      labels: { app: identity-service }
    spec:
      containers:
        - name: app
          image: registry.example.com/banking/identity-service:latest
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: DB_URL, valueFrom: { secretKeyRef: { name: banking-secret, key: IDENTITY_DB_URL } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: banking-secret, key: DB_USERNAME } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: banking-secret, key: DB_PASSWORD } } }
          envFrom:
            - configMapRef: { name: banking-config }
            - secretRef: { name: banking-secret }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
