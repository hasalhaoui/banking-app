spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1999}
    hikari:
      initializationFailTimeout: 60000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope: openid,email,profile
logging.level:
  root: INFO
  com.example.banking: DEBUG
identity.security:
  allowed-origins:
    - ${APP_ALLOWED_ORIGIN:http://localhost:8080}
  jwt:
    issuer: banking-identity-dev
    secret: ${JWT_SECRET:dev-banking-secret-change-me-at-least-32-bytes}
    ttl: PT2H
