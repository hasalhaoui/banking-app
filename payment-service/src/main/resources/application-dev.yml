spring:
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1999}
    hikari:
      initializationFailTimeout: 60000
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
logging.level:
  root: INFO
  com.example.banking: DEBUG
payment.security:
  allowed-origins:
    - ${APP_ALLOWED_ORIGIN:http://localhost:8080}
  jwt:
    issuer: banking-identity-dev
    secret: ${JWT_SECRET:dev-banking-secret-change-me-at-least-32-bytes}
    ttl: PT2H
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG